name: Android build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Report tests started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context='Android device tests' -f description='Testing reader, dictionary and backups on Android' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Free space for the stock Android emulator
        run: |
          # These preinstalled SDKs are unused by this Kotlin/Compose build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h "$HOME"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/run_android_tests.sh
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-device-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
      - name: Report test result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_RESULT" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='Android device tests' -f description="Android device tests: $JOB_RESULT" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
  build:
    needs: android-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report build started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context='Android release' -f description='Compiling and validating Android release' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and validate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease lintRelease testReleaseUnitTest
      - name: Prepare APK
        id: apk
        env:
          NOVA_SIGNING_BUNDLE: ${{ secrets.NOVA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          mkdir -p release
          if [ -n "$NOVA_SIGNING_BUNDLE" ]; then
            python3 scripts/sign_release.py app/build/outputs/apk/release/app-release-unsigned.apk "release/NovaReader-$version.apk"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'APK firmado con la clave permanente de Nova Reader. Paquete io.nova.reader; se instala junto a la app anterior y conserva sus datos independientes.' > release/NOTAS.md
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release/NovaReader-$version-unsigned.apk"
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'Solo artefacto de compilación sin firma. No es instalable y no se publica como release. Configurar NOVA_SIGNING_BUNDLE según docs/COMPILACION-Y-FIRMA.md.' > release/NOTAS.md
            echo '::notice::Build validated. Automatic signing requires NOVA_SIGNING_BUNDLE; unsigned APKs are not published as releases.'
          fi
          printf '\n%s\n' 'Drive requiere configurar el cliente OAuth Android para io.nova.reader y el SHA-1 de signing/release-certificate.json; consulta docs/GOOGLE-DRIVE.md.' >> release/NOTAS.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Enable KVM for signed installation
        if: steps.apk.outputs.signed == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch signed distribution
        if: steps.apk.outputs.signed == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 scripts/check_signed_install.py release/NovaReader-${{ steps.apk.outputs.version }}.apk --unsigned-reference app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NovaReader-${{ steps.apk.outputs.version }}
          path: |
            release/
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testReleaseUnitTest/
            screenshots/
      - name: Publish GitHub release
        if: steps.apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          SIGNED: ${{ steps.apk.outputs.signed }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$SIGNED" != true ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION-build.$GITHUB_RUN_NUMBER" release/*.apk release/NOTAS.md --target "$GITHUB_SHA" --title "Nova Reader $VERSION · build $GITHUB_RUN_NUMBER" --notes-file release/NOTAS.md "${flags[@]}"
      - name: Report build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_RESULT" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='Android release' -f description="Android build and release: $JOB_RESULT" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent

name: Android build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Report tests started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context='Android device tests' -f description='Testing reader, dictionary and backups on Android' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4096M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/run_android_tests.sh
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-device-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
      - name: Report test result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_RESULT" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='Android device tests' -f description="Android device tests: $JOB_RESULT" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
  build:
    needs: android-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report build started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context='Android release' -f description='Compiling and validating Android release' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and validate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease lintRelease testReleaseUnitTest
      - name: Prepare APK
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          mkdir -p release
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            : "${STORE_PASSWORD:?Missing keystore password}" "${KEY_ALIAS:?Missing key alias}" "${KEY_PASSWORD:?Missing key password}"
            keyfile="$RUNNER_TEMP/reader-signing.keystore"
            trap 'rm -f "$keyfile"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "release/NovaReader-$version.apk" "$unsigned"
            certificate=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "release/NovaReader-$version.apk" | sed -n 's/Signer #1 certificate SHA-256 digest: //p')
            if [ "$certificate" != 'a25061d76d480e6e68eeb75d2fd823eb3657e6d8c50793ffcd090f6a4e1f8727' ]; then
              echo 'The signing certificate does not match LumaReader-v1.7.0. Update compatibility cannot be guaranteed.' >&2
              exit 1
            fi
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'APK firmado con la clave de la versión 1.7.0. Conserva el identificador io.luma.reader.' > release/NOTAS.md
          else
            cp "$unsigned" "release/NovaReader-$version-unsigned.apk"
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'Compilación release validada, todavía SIN FIRMA. Este APK no se puede instalar hasta firmarlo con la clave original. No desinstales la versión anterior: su biblioteca es local.' > release/NOTAS.md
          fi
          printf '\n%s\n' 'Cambios: diccionario español sin conexión, búsqueda en todo el libro, marcadores, posiciones de texto, notas navegables, copias locales y soporte opcional de Drive appDataFolder. SQLite y lectura de capítulos en segundo plano. Drive requiere configurar el cliente OAuth Android; consulta docs/GOOGLE-DRIVE.md.' >> release/NOTAS.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: NovaReader-${{ steps.apk.outputs.version }}
          path: |
            release/
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testReleaseUnitTest/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          SIGNED: ${{ steps.apk.outputs.signed }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$SIGNED" != true ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION-build.$GITHUB_RUN_NUMBER" release/*.apk release/NOTAS.md --target "$GITHUB_SHA" --title "Nova Reader $VERSION · build $GITHUB_RUN_NUMBER" --notes-file release/NOTAS.md "${flags[@]}"
      - name: Report build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_RESULT" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='Android release' -f description="Android build and release: $JOB_RESULT" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
